name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image
        run: docker compose --profile test build tests

      - name: Lint
        run: docker compose run --rm --no-deps tests sh -c "ruff check . && ruff format --check ."

      - name: Tests (real MongoDB and Redis from docker-compose.yml)
        run: docker compose run --rm tests

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color

[project]
name = "cohort-insights-api"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"                        # async def tests run without decorators
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bug-prone patterns, UP: modern syntax,
# BLE: no blind `except Exception` - every fallback is explicit and logged
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be used as defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

